[tool.poetry]
name = "deep-generative-models-itmo2024"
version = "0.1.0"
description = ""
authors = ["Anastasia Izyumova"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
black = "^24.2.0"
isort = "^5.13.2"
flake8 = "^7.0.0"
pre-commit = "^3.6.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 1
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true
